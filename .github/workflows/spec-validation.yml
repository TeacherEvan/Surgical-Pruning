name: Spec Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-spec:
    name: Validate Specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON schemas in spec
        run: |
          # Extract and validate JSON examples from the spec
          echo "Checking for valid JSON in specification..."
          # This is a placeholder - actual validation would parse the spec
          # and validate embedded JSON schemas
          echo "✅ Spec validation placeholder passed"

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "docs/SurgicalpruningConcept.txt"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Validate markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/link-check-config.json'

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: david-anthony/markdownlint-action@v2
        with:
          config: '.markdownlint.json'