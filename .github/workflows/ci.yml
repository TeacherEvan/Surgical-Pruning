name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  knip:
    name: Dead-code / unused-dependency scan (knip)
    runs-on: ubuntu-latest
    # NOTE: knip exits non-zero when it finds unused deps/exports. This repo
    # currently has a few (execa, depcheck, @surgical-pruning/core in some
    # packages) that are intentionally NOT removed in this PR to keep it scoped
    # away from the unrelated npm-release package.json changes. Once those are
    # cleaned in a follow-up, drop `continue-on-error` to make knip a hard gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run knip
        run: pnpm run knip
